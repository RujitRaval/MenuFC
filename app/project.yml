name: MenuFC
options:
  bundleIdPrefix: com.rujitraval
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Swift 5 language mode — avoids Swift 6 strict-concurrency churn for v1.
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.rujitraval.menufc
    # Use our hand-written Info.plist (full control over LSUIElement, category, etc.).
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MenuFC/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: MenuFC/Resources/MenuFC.entitlements
    # App Store readiness: Automatic signing + Hardened Runtime.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "39PB68QUZJ"
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    # Designate the AppIcon set in Assets.xcassets as the app icon (required for App Store upload).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  MenuFC:
    type: application
    platform: macOS
    sources:
      - path: MenuFC/Sources
      # Asset catalog must live under `sources` — XcodeGen auto-detects .xcassets and
      # compiles it (Assets.car + app icon). A `resources:` key is ignored by XcodeGen.
      - path: MenuFC/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: MenuFC
